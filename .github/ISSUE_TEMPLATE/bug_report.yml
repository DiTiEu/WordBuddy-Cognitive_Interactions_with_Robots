name: Bug Report
description: Report a problem with WordBuddy
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Robot Control (UR3 motion)
        - Vision System (CNN / camera)
        - Game Logic
        - Text-to-Speech
        - Configuration / Setup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `python scripts/main.py`
        2. Select game mode 2
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      placeholder: "e.g. 3.10.9"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g. Windows 11, Ubuntu 22.04"
    validations:
      required: true

  - type: checkboxes
    id: hardware
    attributes:
      label: Hardware Available
      options:
        - label: UR3 robot arm
        - label: Webcam / USB camera
        - label: Running in offline/simulation mode

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Messages
      render: shell
