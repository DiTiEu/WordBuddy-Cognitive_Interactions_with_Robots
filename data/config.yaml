settings:
  verbose: false  # Metti "true" se vuoi vedere coordinate e dettagli tecnici

robot:
  ip: "10.10.73.237"  # Inserisci l'IP del tuo robot
  port: 30002

camera_id: 0

safety:
  speed: 0.2
  acc: 0.2
  safe_height: 0.25    # Altezza di sicurezza durante gli spostamenti
  z_pick_offset: -0.039 # Quanto scendere per prendere l'oggetto (rispetto alla posa UP)

gripper:
  open_width_mm: 45     # apertura massima desiderata (mm)
grid:
  cell_size_mm: 50
  rows: 1
  cols: 5
vision:
  aruco_size_mm: 40
  ocr_threshold: 150
difficulty: "normal"

#posizione home (coordinate joints0)
home: [0.00087, -1.6877, -0.9894, 1.9697, 1.5591, 0.00767]

# Configurazione della Griglia delle Lettere (SORGENTE)
grid:
  # Posa esatta della lettera 'A' (Punto zero)
  base_pose_A: [0.310, 0.097, 0.037, 0.007, 3.13, 0.006]
  col_spacing: 0.05    # Distanza orizzontale (Y) tra lettere
  row_spacing: 0.06    # Distanza verticale (X) tra righe
  cols_per_row: 7      # Quante lettere ci sono in una riga

# Configurazione degli Slot (DESTINAZIONE)
slots:
  # Posa esatta del primo cerchio (Slot 0)
  base_pose_0: [0.385, -0.250, 0.047, 0.007, 3.13, 0.006]
  
  # Distanze per la diagonale. 
  # Se fosse una linea dritta orizzontale, metti x_step: 0.0
  x_step: 0.00         # Spostamento AVANTI/INDIETRO per ogni slot
  y_step: 0.04         # Spostamento DESTRA/SINISTRA per ogni slot

  

